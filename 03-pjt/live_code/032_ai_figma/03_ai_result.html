<!-- AI 생성 초안: 검수 전 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThRead 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #ffffff;
    }
    .navbar {
      background-color: #f8f9fa;
      border-bottom: 1px solid #e5e5e5;
    }
    .brand-name {
      font-weight: 700;
      font-size: 1.25rem;
    }
    .login-card {
      width: 100%;
      max-width: 520px;
    }
    .form-label {
      font-weight: 600;
    }
    @media (max-width: 576px) {
      .login-card { max-width: 420px; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg" aria-label="상단 네비게이션 바">
    <div class="container-fluid">
      <a class="navbar-brand brand-name" href="#">ThRead</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav" aria-controls="topNav" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="topNav">
        <ul class="navbar-nav mb-2 mb-lg-0 align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="#">쓰레드</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">도서 검색</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">마이 페이지</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">로그아웃</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 56px); padding: 40px 16px;">
    <div class="card login-card shadow-sm">
      <div class="card-body p-4">
        <form>
          <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" aria-label="이메일 입력">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" aria-label="비밀번호 입력">
          </div>
          <div class="d-grid mt-2">
            <button type="submit" class="btn btn-success btn-lg fw-semibold" style="height: 48px;">로그인</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
