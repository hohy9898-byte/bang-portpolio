<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThRead 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --thread-green: #20bd0b; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #111827;
      background: #fff;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }
    .navbar-thread {
      height: 56px;
      padding: 0 32px;
      border-bottom: 1px solid #e1e4e8;
      background: #f8f9fa;
    }
    .thread-brand {
      color: #111827;
      font-size: 23px;
      font-weight: 750;
      letter-spacing: -.7px;
      text-decoration: none;
      line-height: 1;
    }
    .thread-nav { gap: 32px; }
    .thread-nav a {
      color: #737b8b;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }
    .thread-nav a.active { color: #111827; font-weight: 600; }
    .login-stage {
      min-height: calc(100vh - 56px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 500px;
      border: 1px solid #dfe3e8;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(17, 24, 39, .13);
      overflow: hidden;
      background: #fff;
    }
    .login-fields { padding: 20px 16px 20px; }
    .login-field + .login-field { margin-top: 27px; }
    .login-field label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 600;
    }
    .login-field .form-control {
      height: 40px;
      padding: 8px 12px;
      border-color: #dce1e8;
      border-radius: 4px;
      color: #374151;
      font-size: 14px;
      box-shadow: none;
    }
    .login-field .form-control:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 .15rem rgba(32, 189, 11, .12);
    }
    .login-actions {
      padding: 12px 26px 30px;
      border-top: 1px solid #e1e4e8;
    }
    .btn-thread {
      height: 36px;
      padding: 6px 12px;
      border: 0;
      border-radius: 4px;
      background: var(--thread-green);
      color: #fff;
      font-size: 14px;
    }
    .btn-thread:hover, .btn-thread:focus { background: #1baa0a; color: #fff; }
    @media (max-width: 575.98px) {
      .navbar-thread { height: auto; min-height: 56px; padding: 0 12px; }
      .thread-brand { font-size: 20px; letter-spacing: -.5px; }
      .thread-nav { gap: clamp(8px, 2.4vw, 14px); }
      .thread-nav a { font-size: 11px; }
      .login-stage { min-height: calc(100vh - 56px); padding: 24px 16px; }
      .login-fields { padding: 20px 16px; }
      .login-field + .login-field { margin-top: 24px; }
      .login-actions { padding: 12px 20px 26px; }
    }
    @media (max-width: 360px) {
      .navbar-thread { padding: 0 9px; }
      .thread-brand { font-size: 18px; }
      .thread-nav { gap: 7px; }
      .thread-nav a { font-size: 10px; }
    }
  </style>
</head>
<body>
  <nav class="navbar-thread d-flex align-items-center justify-content-between" aria-label="주 메뉴">
    <a class="thread-brand" href="#">ThRead</a>
    <div class="thread-nav d-flex align-items-center">
      <a class="active" href="#">쓰레드</a>
      <a href="#">도서 검색</a>
      <a href="#">마이 페이지</a>
      <a href="#">로그아웃</a>
    </div>
  </nav>

  <main class="login-stage">
    <section class="login-card" aria-label="로그인">
      <form action="#" method="post">
        <div class="login-fields">
          <div class="login-field">
            <label for="email">이메일</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="login-field">
            <label for="password">비밀번호</label>
            <input class="form-control" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
          </div>
        </div>
        <div class="login-actions">
          <button class="btn btn-thread w-100" type="submit">로그인</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
